<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – FineEscorts Kenya</title>
  <link rel="icon" type="image/webp" href="/fineescorts-favicon.webp">
  <link rel="stylesheet" href="css/profile.css">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { background: #0d0d0d; font-family: 'Jost', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .login-container { max-width: 400px; margin: 60px auto; padding: 35px; background: #1a1a1a; border-radius: 16px; border: 1px solid #2c2c2c; }
    .login-container h1 { text-align: center; color: #eaeaea; font-size: 1.8rem; margin-bottom: 8px; }
    .login-container .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 0.95rem; }
    .login-container .form-group { margin-bottom: 20px; }
    .login-container label { display: block; font-weight: 600; margin-bottom: 5px; color: #eaeaea; }
    .login-container input { width: 100%; padding: 12px; border: 2px solid #2c2c2c; border-radius: 8px; font-size: 16px; background: #0d0d0d; color: #eaeaea; transition: border 0.3s; }
    .login-container input:focus { border-color: #c7a76c; outline: none; }
    .login-container .btn-login { width: 100%; padding: 14px; background: #c7a76c; color: #0d0d0d; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
    .login-container .btn-login:hover { background: #dbb87a; }
    .login-container .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #ff6b6b; background: #2a1a1a; padding: 12px; border-radius: 8px; display: none; margin-bottom: 15px; border-left: 4px solid #ff6b6b; }
    .login-container .signup-link { text-align: center; margin-top: 20px; color: #888; }
    .login-container .signup-link a { color: #c7a76c; font-weight: 600; text-decoration: none; }
    .login-container .signup-link a:hover { text-decoration: underline; }
    .login-container .forgot-password { text-align: right; margin-top: 5px; }
    .login-container .forgot-password a { color: #c7a76c; font-size: 0.9rem; text-decoration: none; }
    .login-container .forgot-password a:hover { text-decoration: underline; }
    .back-home { text-align: center; margin-top: 15px; }
    .back-home a { color: #888; text-decoration: none; }
    .back-home a:hover { color: #c7a76c; }
  </style>
</head>
<body>
  <header style="background: #1a1a1a; padding: 15px 0; border-bottom: 1px solid #2c2c2c;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;">
      <a href="/" style="text-decoration: none;">
        <div style="font-size: 24px; font-weight: 700; color: #c7a76c;">Fine<span style="color: #eaeaea;">Escorts</span></div>
      </a>
      <nav style="display: flex; gap: 15px; align-items: center;">
        <a href="/" style="color: #a0a0a0; text-decoration: none;">Home</a>
        <a href="signup.html" style="color: #c7a76c; text-decoration: none; font-weight: 600;">Become an Escort</a>
      </nav>
    </div>
  </header>

  <main style="flex: 1;">
    <div class="login-container">
      <h1>🔐 Welcome Back</h1>
      <p class="subtitle">Login to your FineEscorts account</p>

      <div id="errorMessage" class="error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password">
        </div>

        <div class="forgot-password">
          <a href="/reset-password.html">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Login</button>
      </form>

      <div class="signup-link">
        Don't have an account? <a href="signup.html">Sign up here</a>
      </div>
      <div class="back-home">
        <a href="/">← Back to Home</a>
      </div>
    </div>
  </main>

  <footer style="background: #1a1a1a; border-top: 1px solid #2c2c2c; padding: 20px 0; text-align: center; color: #555; font-size: 13px;">
    <p>&copy; 2026 FineEscorts Kenya. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      const loginBtn = document.getElementById('loginBtn');

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.message || 'Login failed. Please check your credentials.';
          errorDiv.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.innerHTML = 'Login';
          return;
        }

        // ─── Store authentication data ────────────────────────────
        localStorage.setItem('token', data.token);

        // Store the FULL user object (contains email, role, etc.)
        localStorage.setItem('user', JSON.stringify(data.user));

        // Optional: keep email and role for backward compatibility
        localStorage.setItem('userEmail', data.user?.email || email);
        localStorage.setItem('userRole', data.user?.role || 'escort');

        if (data.subscription?.expired) {
          alert(data.subscription.message);
        }

        // ─── Redirect based on role ──────────────────────────────
        if (data.user?.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/dashboard.html';
        }

      } catch (err) {
        errorDiv.textContent = 'An error occurred. Please try again later.';
        errorDiv.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Login';
      }
    });
  </script>
</body>
</html>
