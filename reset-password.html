<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password – FineEscorts Kenya</title>
    <link rel="icon" type="image/webp" href="/fineescorts-favicon.webp" />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            font-family: 'Jost', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #eaeaea;
        }
        header {
            background: #1a1a1a;
            padding: 15px 0;
            border-bottom: 1px solid #2c2c2c;
        }
        header .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            text-decoration: none;
        }
        header .logo {
            font-size: 24px;
            font-weight: 700;
            color: #c7a76c;
        }
        header .logo span {
            color: #eaeaea;
        }
        nav a {
            color: #a0a0a0;
            text-decoration: none;
            margin-left: 15px;
        }
        nav a:hover {
            color: #c7a76c;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .reset-container {
            max-width: 420px;
            width: 100%;
            background: #1a1a1a;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #2c2c2c;
        }
        .reset-container h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #eaeaea;
        }
        .reset-container .subtitle {
            color: #888;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .reset-container .form-group {
            margin-bottom: 20px;
        }
        .reset-container label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #eaeaea;
        }
        .reset-container input {
            width: 100%;
            padding: 12px;
            border: 2px solid #2c2c2c;
            border-radius: 8px;
            font-size: 16px;
            background: #0d0d0d;
            color: #eaeaea;
            transition: border 0.3s;
        }
        .reset-container input:focus {
            border-color: #c7a76c;
            outline: none;
        }
        .reset-container .btn {
            width: 100%;
            padding: 14px;
            background: #c7a76c;
            color: #0d0d0d;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .reset-container .btn:hover {
            background: #dbb87a;
        }
        .reset-container .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .reset-container .btn-secondary {
            background: #2a2a2a;
            color: #a0a0a0;
            margin-top: 10px;
        }
        .reset-container .btn-secondary:hover {
            background: #3a3a3a;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .message.success {
            background: #1a3a2a;
            color: #4CAF50;
            border-left: 4px solid #4CAF50;
            display: block;
        }
        .message.error {
            background: #3a1a1a;
            color: #ff6b6b;
            border-left: 4px solid #ff6b6b;
            display: block;
        }
        .reset-container .back-link {
            text-align: center;
            margin-top: 15px;
        }
        .reset-container .back-link a {
            color: #888;
            text-decoration: none;
        }
        .reset-container .back-link a:hover {
            color: #c7a76c;
        }
        .hidden {
            display: none !important;
        }
        footer {
            background: #1a1a1a;
            border-top: 1px solid #2c2c2c;
            padding: 20px 0;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/">
                <div class="logo">Fine<span>Escorts</span></div>
            </a>
            <nav>
                <a href="/">Home</a>
                <a href="login.html">Login</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="reset-container" id="resetContainer">
            <h1 id="pageTitle">Reset Password</h1>
            <p class="subtitle" id="pageSubtitle">Enter your email to receive a reset link</p>

            <div id="messageBox" class="message"></div>

            <!-- Step 1: Request Reset -->
            <form id="requestForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required />
                </div>
                <button type="submit" class="btn" id="requestBtn">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
            </form>

            <!-- Step 2: Set New Password -->
            <form id="resetForm" class="hidden">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" required />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
                </div>
                <button type="submit" class="btn" id="resetBtn">
                    <i class="fas fa-check"></i> Reset Password
                </button>
            </form>

            <div class="back-link">
                <a href="login.html">← Back to Login</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 FineEscorts Kenya. All rights reserved.</p>
    </footer>

    <script>
        (function() {
            const API_BASE = window.location.origin;

            // DOM Elements
            const requestForm = document.getElementById('requestForm');
            const resetForm = document.getElementById('resetForm');
            const emailInput = document.getElementById('email');
            const newPassInput = document.getElementById('newPassword');
            const confirmPassInput = document.getElementById('confirmPassword');
            const requestBtn = document.getElementById('requestBtn');
            const resetBtn = document.getElementById('resetBtn');
            const messageBox = document.getElementById('messageBox');
            const pageTitle = document.getElementById('pageTitle');
            const pageSubtitle = document.getElementById('pageSubtitle');

            // Helper: show message
            function showMessage(text, type = 'success') {
                messageBox.textContent = text;
                messageBox.className = 'message ' + type;
            }

            function hideMessage() {
                messageBox.className = 'message';
                messageBox.textContent = '';
            }

            // Helper: set loading state
            function setLoading(btn, loading) {
                if (loading) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = btn === requestBtn ? '<i class="fas fa-paper-plane"></i> Send Reset Link' : '<i class="fas fa-check"></i> Reset Password';
                }
            }

            // ─── Check for token in URL ──────────────────────────────
            function getTokenFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('token');
            }

            const token = getTokenFromUrl();

            if (token) {
                // Switch to reset form
                requestForm.classList.add('hidden');
                resetForm.classList.remove('hidden');
                pageTitle.textContent = 'Set New Password';
                pageSubtitle.textContent = 'Enter your new password below.';

                // Optional: verify token validity (background check)
                fetch(`${API_BASE}/api/auth/reset-password/${token}`)
                    .then(res => res.json())
                    .then(data => {
                        if (!data.valid) {
                            showMessage('Invalid or expired reset token. Please request a new link.', 'error');
                            resetForm.classList.add('hidden');
                            requestForm.classList.remove('hidden');
                            pageTitle.textContent = 'Reset Password';
                            pageSubtitle.textContent = 'Enter your email to receive a reset link';
                        }
                    })
                    .catch(() => {
                        showMessage('Could not verify token. Please try again.', 'error');
                    });
            } else {
                // Show request form
                requestForm.classList.remove('hidden');
                resetForm.classList.add('hidden');
            }

            // ─── Request Reset ────────────────────────────────────────
            requestForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = emailInput.value.trim();
                if (!email) {
                    showMessage('Please enter your email address.', 'error');
                    return;
                }

                setLoading(requestBtn, true);
                hideMessage();

                try {
                    const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        showMessage(data.message || 'If that email is registered, you will receive a reset link.', 'success');
                        emailInput.value = '';
                    } else {
                        showMessage(data.message || 'Something went wrong. Please try again.', 'error');
                    }
                } catch (err) {
                    showMessage('Network error. Please try again later.', 'error');
                    console.error(err);
                } finally {
                    setLoading(requestBtn, false);
                }
            });

            // ─── Reset Password ────────────────────────────────────────
            resetForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const newPassword = newPassInput.value.trim();
                const confirmPassword = confirmPassInput.value.trim();

                if (!newPassword || newPassword.length < 6) {
                    showMessage('Password must be at least 6 characters.', 'error');
                    return;
                }
                if (newPassword !== confirmPassword) {
                    showMessage('Passwords do not match.', 'error');
                    return;
                }

                setLoading(resetBtn, true);
                hideMessage();

                try {
                    const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, newPassword })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        showMessage('✅ Password reset successfully! You can now log in with your new password.', 'success');
                        // Optionally redirect after a few seconds
                        setTimeout(() => {
                            window.location.href = '/login.html';
                        }, 3000);
                    } else {
                        showMessage(data.message || 'Failed to reset password. Please try again.', 'error');
                    }
                } catch (err) {
                    showMessage('Network error. Please try again later.', 'error');
                    console.error(err);
                } finally {
                    setLoading(resetBtn, false);
                }
            });
        })();
    </script>
</body>
</html>
